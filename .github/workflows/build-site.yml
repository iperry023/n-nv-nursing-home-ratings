name: Build site

on:
  push:
    branches: [main]
    paths:
      - "uploads/**"
      - "data/**"
      - "supplements/**"
      - "scripts/**"
      - "config.json"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # newest main, so back-to-back uploads build on each other

      - id: check
        name: Look for a CMS upload
        run: |
          if compgen -G "uploads/*.csv" >/dev/null || compgen -G "uploads/*.zip" >/dev/null || compgen -G "data/months/*.csv" >/dev/null; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::No CMS file in uploads/ yet - nothing to publish."; fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Trim new CMS uploads to this site's facilities and build the site
        if: steps.check.outputs.ready == 'true'
        run: python scripts/build.py

      - name: Save the trimmed month and remove the national files
        if: steps.check.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data uploads
          if git diff --cached --quiet; then echo "Nothing new to store."; exit 0; fi
          git commit -m "Store trimmed CMS data ($(ls data/months/*.csv | tail -1 | xargs basename .csv)) and remove national upload files"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.ready == 'true'
        with:
          path: site

      - name: Close the monthly reminder if this month's file is in
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(python3 -c "import json;print(json.load(open('site/data.json'))['meta']['cms_processing_date'] or '')")
          if [ "${D:0:7}" = "$(date -u +%Y-%m)" ]; then
            for n in $(gh issue list --label upload-reminder --state open --json number --jq '.[].number' 2>/dev/null); do
              gh issue close "$n" --comment "Got it: the site now shows CMS data processed $D."
            done
          fi

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
