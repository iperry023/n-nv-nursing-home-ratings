name: Weekly update

on:
  schedule:
    # Every Monday at 14:30 UTC (6:30 AM Pacific standard time)
    - cron: "30 14 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull CMS data and build the site
        run: python scripts/build.py

      - name: Save a dated copy of this week's data
        run: |
          mkdir -p history
          cp site/data.csv "history/$(date -u +%Y-%m-%d).csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git diff --cached --quiet || git commit -m "Weekly data snapshot $(date -u +%Y-%m-%d)"
          git push || echo "Snapshot push skipped"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
