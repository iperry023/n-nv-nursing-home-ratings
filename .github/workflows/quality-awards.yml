name: Check AHCA quality awards

on:
  schedule:
    - cron: "23 17 10 * *"   # 10th of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  awards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search AHCA's recipient list
        run: python3 scripts/ahca_awards.py
      - name: Save changes (this also rebuilds the site)
        run: |
          if git diff --quiet supplements/quality_awards.json; then
            echo "No award changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add supplements/quality_awards.json
          git commit -m "Update AHCA quality awards"
          git push
